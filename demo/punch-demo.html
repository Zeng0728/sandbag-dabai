<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>沙袋大白 · 击打效果样片</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#FFF9F3 0%,#FDEFE4 55%,#F6E2D2 100%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding:18px 14px 26px;overflow-x:hidden;
  }
  .title{font-size:15px;font-weight:800;color:#3d2f27;letter-spacing:2px;margin-bottom:2px}
  .subtitle{font-size:11px;color:#a08b7c;letter-spacing:1px;margin-bottom:14px}

  /* ===== 舞台 ===== */
  .stage{position:relative;width:340px;height:400px;display:flex;align-items:center;justify-content:center}

  /* 大白本体 */
  .dabai{position:relative;width:300px;height:300px;transition:transform .08s}
  .body{
    position:absolute;inset:0;border-radius:50% 50% 46% 46%/48% 48% 52% 52%;
    background:linear-gradient(160deg,#ffffff 0%,#f7f1ea 62%,#eadfd4 100%);
    box-shadow:0 18px 40px rgba(160,120,90,.28), inset 0 -14px 26px rgba(200,170,145,.35);
    overflow:hidden;transition:filter .25s;
  }
  /* 照片窗口（把上传的图贴在大白身上） */
  .photo{
    position:absolute;left:50%;top:61%;transform:translate(-50%,-50%);
    width:166px;height:166px;border-radius:18px;overflow:hidden;
    background:linear-gradient(150deg,#d8c7b6,#a08b7c);
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.9), 0 6px 16px rgba(120,90,70,.25);
    display:flex;align-items:center;justify-content:center;transition:filter .3s;
  }
  .photo .hint{font-size:12px;color:rgba(255,255,255,.85);letter-spacing:1px;text-align:center;line-height:1.6}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .crack{
    position:absolute;inset:0;opacity:0;transition:opacity .3s;
    background:
      linear-gradient(118deg,transparent 44%,rgba(60,40,30,.55) 46%,transparent 47%),
      linear-gradient(72deg,transparent 56%,rgba(60,40,30,.5) 58%,transparent 59%),
      linear-gradient(150deg,transparent 66%,rgba(60,40,30,.4) 68%,transparent 69%);
  }

  /* 五官 */
  .eye{
    position:absolute;width:20px;height:28px;border-radius:50%;background:#2f2b28;
    top:16px;transition:all .28s;transform-origin:center;
  }
  .eye.l{left:74px} .eye.r{right:74px}
  .eye::after{ /* 高光 */
    content:"";position:absolute;left:5px;top:5px;width:7px;height:9px;border-radius:50%;
    background:rgba(255,255,255,.85);
  }
  .mouth{
    position:absolute;left:50%;top:54px;transform:translateX(-50%);
    width:30px;height:4px;border-radius:4px;background:#2f2b28;opacity:.55;transition:all .28s;
  }
  .blush{position:absolute;width:26px;height:14px;border-radius:50%;background:#FFC7C2;opacity:.7;top:46px}
  .blush.l{left:46px} .blush.r{right:46px}

  /* 淤青 */
  .bruise{
    position:absolute;border-radius:50%;opacity:0;transition:opacity .35s;
    background:radial-gradient(circle,#8d5bd0 0%,#6d46b8 45%,rgba(109,70,184,0) 72%);
    filter:blur(1px);
  }
  .b1{width:42px;height:36px;left:16px;top:110px;transform:rotate(-12deg)}
  .b2{width:44px;height:38px;right:14px;top:150px;transform:rotate(14deg)}
  .b3{width:64px;height:34px;left:96px;bottom:6px;transform:rotate(6deg)}
  .b4{width:46px;height:26px;left:96px;top:4px;transform:rotate(-8deg)}
  .bandage{
    position:absolute;opacity:0;transition:opacity .35s;
    background:linear-gradient(180deg,#fff 0%,#f2ece4 100%);
    box-shadow:0 2px 6px rgba(0,0,0,.12);border-radius:3px;
  }
  .bandage.a{width:46px;height:13px;left:22px;top:128px;transform:rotate(-16deg)}
  .bandage.b{width:13px;height:40px;right:20px;top:168px;transform:rotate(10deg)}

  /* 眼泪 */
  .tear{
    position:absolute;width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:linear-gradient(180deg,#bfe3ff,#7fc4f5);opacity:0;
    box-shadow:0 0 6px rgba(120,190,240,.6);
  }
  .tear.l{left:80px;top:42px} .tear.r{right:80px;top:42px}
  .tear.run{animation:tearfall 1.1s ease-in infinite}
  @keyframes tearfall{
    0%{opacity:0;transform:translateY(0) scale(.8)}
    20%{opacity:1}
    100%{opacity:0;transform:translateY(86px) scale(1.05)}
  }

  /* ===== 状态：0完好 1微肿 2鼻青脸肿 3哭 4打服 ===== */
  .dabai.s1 .b1{opacity:.55}
  .dabai.s1 .eye.l{height:24px;width:24px;border-radius:50% 50% 44% 44%}
  .dabai.s1 .eye.l::after{opacity:.3}

  .dabai.s2 .b1,.dabai.s2 .b2{opacity:.75}
  .dabai.s2 .b3{opacity:.5}
  .dabai.s2 .bandage.a{opacity:1}
  .dabai.s2 .eye.l{height:9px;width:17px;border-radius:40%}   /* 眯成一条 */
  .dabai.s2 .eye.r{height:26px;width:26px}
  .dabai.s2 .mouth{width:24px;height:10px;border-radius:0 0 16px 16px;background:#2f2b28;opacity:.8}

  .dabai.s3 .b1,.dabai.s3 .b2,.dabai.s3 .b3,.dabai.s3 .b4{opacity:.85}
  .dabai.s3 .bandage.a,.dabai.s3 .bandage.b{opacity:1}
  .dabai.s3 .eye{height:7px;width:19px;border-radius:20px;background:#2f2b28}
  .dabai.s3 .eye::after{opacity:0}
  .dabai.s3 .mouth{width:18px;height:18px;border-radius:50%;background:#8a4a40;opacity:.9}
  .dabai.s3 .tear{opacity:.5}

  .dabai.s4{filter:saturate(.85)}
  .dabai.s4 .b1,.dabai.s4 .b2,.dabai.s4 .b3,.dabai.s4 .b4{opacity:.95}
  .dabai.s4 .bandage.a,.dabai.s4 .bandage.b{opacity:1}
  .dabai.s4 .eye{height:5px;width:17px;border-radius:20px}
  .dabai.s4 .eye::after{opacity:0}
  .dabai.s4 .mouth{width:24px;height:4px;border-radius:4px;opacity:.85}
  .dabai.s4 .photo{filter:grayscale(.45) brightness(.92)}
  .dabai.s4 .photo .crack{opacity:1}
  /* 更狠的分档 */
  .dabai.s2 .bl1{opacity:.85}
  .dabai.s2 .tooth{opacity:1}
  .dabai.s2 .bump{opacity:.5}
  .dabai.s3 .bl1,.dabai.s3 .bl2{opacity:1}
  .dabai.s3 .tooth{opacity:1}
  .dabai.s3 .bump{opacity:1}
  .dabai.s3 .smoke{opacity:.75}
  .dabai.s4 .bl1,.dabai.s4 .bl2,.dabai.s4 .bl3{opacity:1}
  .dabai.s4 .tooth,.dabai.s4 .bump{opacity:1}
  .dabai.s4 .smoke{opacity:1}
  .dabai.s4 .xx{opacity:1}
  .dabai.s4 .eye{opacity:0}
  .dabai.s4 .tear{opacity:.35}

  /* 被打时抖一下 */
  @keyframes shakeit{
    0%{transform:translate(0,0) rotate(0)}
    20%{transform:translate(-9px,3px) rotate(-2.2deg) scale(1.02)}
    40%{transform:translate(8px,-4px) rotate(1.8deg)}
    60%{transform:translate(-6px,-2px) rotate(-1.2deg)}
    80%{transform:translate(4px,3px) rotate(.8deg)}
    100%{transform:translate(0,0) rotate(0)}
  }
  .dabai.hit{animation:shakeit .34s cubic-bezier(.36,.07,.19,.97)}

  /* 飘伤害数字 */
  .dmg{
    position:absolute;font-size:26px;font-weight:900;color:#FF6A3D;
    text-shadow:0 2px 0 #fff,0 0 14px rgba(255,106,61,.5);
    pointer-events:none;animation:floatup .82s ease-out forwards;z-index:9;
  }
  @keyframes floatup{
    0%{opacity:0;transform:translate(-50%,0) scale(.6)}
    18%{opacity:1;transform:translate(-50%,-16px) scale(1.18)}
    100%{opacity:0;transform:translate(-50%,-72px) scale(1)}
  }
  /* 星星/碎屑 */
  .spark{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:8}
  /* 全屏红闪 */
  .flash{position:fixed;inset:0;background:rgba(255,90,60,.22);opacity:0;pointer-events:none;z-index:20}
  .flash.on{animation:fl .18s ease-out}
  @keyframes fl{0%{opacity:1}100%{opacity:0}}

  /* ===== 血条（火气值）===== */
  .hpwrap{width:300px;margin-top:6px}
  .hphead{display:flex;justify-content:space-between;font-size:12px;color:#8a7362;margin-bottom:5px}
  .hphead b{color:#3d2f27;font-size:14px}
  .hp{height:14px;border-radius:99px;background:#F0E2D6;overflow:hidden;box-shadow:inset 0 2px 4px rgba(160,120,90,.18)}
  .hp i{display:block;height:100%;width:100%;border-radius:99px;
        background:linear-gradient(90deg,#FFB27A,#FF7A45);
        transition:width .3s cubic-bezier(.2,.8,.2,1)}
  .combo{font-size:12px;color:#FF6A3D;font-weight:800;height:16px;margin-top:6px;text-align:center}

  /* ===== 按钮 ===== */
  .acts{display:flex;gap:10px;margin-top:14px}
  .act{width:88px;height:72px;border:0;border-radius:18px;background:#fff;color:#6b5748;
       font-size:12px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:3px;
       box-shadow:0 5px 16px rgba(180,140,110,.22);transition:.12s}
  .act span{font-size:24px;line-height:1}
  .act:hover{transform:translateY(-2px)}
  .act:active{transform:scale(.94)}
  .act.on{background:linear-gradient(160deg,#FF9A62,#FF6A3D);color:#fff;
          box-shadow:0 8px 20px rgba(255,106,61,.42)}
  .act small{font-size:10px;opacity:.6}

  /* ===== 对话框 ===== */
  .talk{width:340px;margin-top:16px}
  .bubble{background:#fff;border-radius:16px 16px 16px 4px;padding:12px 14px;
          font-size:13.5px;line-height:1.7;color:#4a3a30;
          box-shadow:0 6px 20px rgba(180,140,110,.2);min-height:44px}
  .bubble .who{font-size:10.5px;color:#a08b7c;letter-spacing:1px;margin-bottom:5px}
  .row{display:flex;gap:8px;margin-top:10px}
  .row input{flex:1;height:42px;border:0;border-radius:12px;padding:0 14px;font-size:13px;
             font-family:inherit;background:#fff;color:#4a3a30;box-shadow:0 4px 14px rgba(180,140,110,.16)}
  .row input::placeholder{color:#bfab9b}
  .row button{width:52px;height:42px;border:0;border-radius:12px;background:#FF7A45;color:#fff;
              font-size:15px;cursor:pointer;font-family:inherit}

  /* ===== 上传 ===== */
  .upload{display:flex;gap:8px;margin-top:12px;width:340px}
  .upload label,.upload button{
    flex:1;height:40px;border:1.5px dashed #E2CBB8;border-radius:12px;background:rgba(255,255,255,.7);
    color:#a08b7c;font-size:12.5px;font-family:inherit;display:flex;align-items:center;
    justify-content:center;cursor:pointer;gap:6px}
  .upload button{border-style:solid;border-color:transparent;background:rgba(255,255,255,.9)}
  .upload input{display:none}
  .tip{font-size:11px;color:#b09a89;margin-top:10px;text-align:center;line-height:1.7;max-width:340px}
.stars{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:120px;height:30px;opacity:0;transition:opacity .4s}
  .stars i{position:absolute;font-style:normal;font-size:15px;color:#FFC94A;text-shadow:0 0 8px rgba(255,201,74,.8)}
  .stars i:nth-child(1){left:6px;top:8px}
  .stars i:nth-child(2){left:50px;top:0}
  .stars i:nth-child(3){right:6px;top:10px}
  .dabai.s4 .stars{opacity:1;animation:spin 1.6s linear infinite}
  @keyframes spin{0%{transform:translateX(-50%) rotate(0)}100%{transform:translateX(-50%) rotate(360deg)}}
  /* ===== 更狠的伤：血 / 牙 / 肿包 / 冒烟 / XX 眼 ===== */
  .blood{position:absolute;background:linear-gradient(180deg,#E0453B,#A81C15);opacity:0;
         transition:opacity .35s;border-radius:3px 3px 60% 60%;z-index:3;
         box-shadow:0 2px 0 -1px #A81C15}
  .bl1{width:7px;height:22px;left:50%;top:60px;transform:translateX(-50%)}
  .bl2{width:6px;height:28px;left:calc(50% + 13px);top:64px}
  .bl3{width:5px;height:15px;left:calc(50% - 19px);top:64px}
  .tooth{position:absolute;width:9px;height:11px;border-radius:2px;background:#fff;
         box-shadow:0 1px 3px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;
         left:calc(50% - 4px);top:57px;z-index:4}
  .bump{position:absolute;width:44px;height:36px;border-radius:50%;opacity:0;transition:.35s;
        background:radial-gradient(circle at 36% 30%,#f3cfc6,#dc9a8c 66%,#c47a6c);
        box-shadow:0 4px 10px rgba(180,110,100,.4);left:116px;top:-8px;z-index:2}
  .smoke{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:90px;height:60px;
         opacity:0;transition:opacity .4s;z-index:2}
  .smoke i{position:absolute;width:15px;height:15px;border-radius:50%;
           background:rgba(158,148,143,.6);filter:blur(3px)}
  .smoke i:nth-child(1){left:10px;animation:puff 2.1s ease-out infinite}
  .smoke i:nth-child(2){left:38px;animation:puff 2.1s .7s ease-out infinite}
  .smoke i:nth-child(3){left:64px;animation:puff 2.1s 1.4s ease-out infinite}
  @keyframes puff{0%{opacity:0;transform:translateY(0) scale(.6)}
                  30%{opacity:.9}100%{opacity:0;transform:translateY(-50px) scale(2)}}
  .xx{position:absolute;width:26px;height:26px;top:20px;opacity:0;transition:opacity .3s;z-index:5}
  .xx.l{left:71px} .xx.r{right:71px}
  .xx::before,.xx::after{content:"";position:absolute;left:0;top:11px;width:26px;height:4px;
                         border-radius:3px;background:#2f2b28}
  .xx::before{transform:rotate(45deg)} .xx::after{transform:rotate(-45deg)}
  /* 屏边血晕 */
  .vig{position:fixed;inset:0;pointer-events:none;z-index:15;transition:box-shadow .45s}
</style>
</head>
<body>

<div class="title">沙 袋 大 白</div>
<div class="subtitle">击打效果样片 · 打到自己服软</div>

<div class="stage" id="stage">
  <div class="dabai s0" id="dabai">
    <div class="body">
      <div class="mouth" id="mouth"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="blush l"></div>
      <div class="blush r"></div>
      <div class="photo" id="photo">
        <div class="hint">上传一张<br>你讨厌的东西</div>
        <div class="crack"></div>
      </div>
      <div class="bruise b1"></div>
      <div class="bruise b2"></div>
      <div class="bruise b3"></div>
      <div class="bruise b4"></div>
      <div class="bandage a"></div>
      <div class="bandage b"></div>
      <div class="tear l"></div>
      <div class="tear r"></div>
      <div class="blood bl1"></div>
      <div class="blood bl2"></div>
      <div class="blood bl3"></div>
      <div class="tooth"></div>
      <div class="bump"></div>
      <div class="smoke"><i></i><i></i><i></i></div>
      <div class="xx l"></div>
      <div class="xx r"></div>
      <div class="stars"><i>★</i><i>☆</i><i>★</i></div>
    </div>
  </div>
</div>

<div class="hpwrap">
  <div class="hphead"><span>火气值</span><b><span id="hpnum">100</span>%</b></div>
  <div class="hp"><i id="hpbar"></i></div>
  <div class="combo" id="combo"></div>
</div>

<div class="acts">
  <button class="act on" data-mode="glove"><span>👊</span>拳套<small>-3</small></button>
  <button class="act" data-mode="rock"><span>🪨</span>石块<small>-10</small></button>
  <button class="act" data-mode="heavy"><span>💥</span>重击<small>-28</small></button>
</div>

<div class="upload">
  <label for="file">📷 上传一张照片</label>
  <input type="file" id="file" accept="image/*">
  <button id="reset">↺ 重来</button>
</div>

<div class="talk">
  <div class="bubble">
    <div class="who">它说</div>
    <div id="say">你上传的那张照片，就是你今天要打的东西。</div>
  </div>
  <div class="row">
    <input id="inp" placeholder="跟它说两句…" maxlength="60">
    <button id="send">发送</button>
  </div>
</div>

<div class="tip">👊 连点最快　🪨 伤害中等　💥 一下破防（火气 -28）<br>打到 0%，它就彻底服软了</div>

<div class="vig" id="vig"></div>
<div class="flash" id="flash"></div>

<script>
const MAXHP = 100;
const DMG = { glove: 3, rock: 10, heavy: 28 };
const COLORS = ['#FF6A3D','#FFB27A','#FFD166','#8d5bd0','#7fc4f5'];

let hp = MAXHP;
let combo = 0;
let mode = 'glove';
let cleared = false;

const $ = s => document.querySelector(s);
const dabai = $('#dabai');
const stage = $('#stage');
const flash = $('#flash');
const say = $('#say');
const hpbar = $('#hpbar');
const hpnum = $('#hpnum');
const comboEl = $('#combo');

/* ---------- 音效：WebAudio 合成，不需要素材 ---------- */
let ac = null;
function thud(strength = 1) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    // 低频"咚"
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150 * strength, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28 * strength, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + 0.24);
    // 高频"啪"
    const b = ac.createBufferSource();
    const len = Math.floor(ac.sampleRate * 0.05);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3;
    b.buffer = buf;
    const g2 = ac.createGain();
    g2.gain.value = 0.16 * strength;
    b.connect(g2).connect(ac.destination);
    b.start(t);
  } catch (e) {}
}

/* ---------- 状态 ---------- */
function stageClass() {
  if (hp <= 0) return 's4';
  if (hp <= 30) return 's3';
  if (hp <= 60) return 's2';
  if (hp <= 85) return 's1';
  return 's0';
}

function render() {
  hpbar.style.width = Math.max(0, hp) + '%';
  hpnum.textContent = Math.max(0, Math.round(hp));
  dabai.className = 'dabai ' + stageClass();
  const dmgRatio = Math.max(0, Math.min(1, 1 - hp / 100));
  if (vig) vig.style.boxShadow = 'inset 0 0 ' + Math.round(30 + dmgRatio * 90) + 'px rgba(190,50,40,' + (dmgRatio * 0.42).toFixed(2) + ')';
  if (hp <= 0) {
    hpbar.style.background = 'linear-gradient(90deg,#c9d6e2,#a8b8c8)';
    comboEl.textContent = '★ 它服软了 —— 火气清零';
  } else {
    hpbar.style.background = 'linear-gradient(90deg,#FFB27A,#FF7A45)';
  }
}

/* ---------- 特效 ---------- */
function popDamage(n) {
  const el = document.createElement('div');
  el.className = 'dmg';
  el.textContent = '-' + n;
  el.style.left = (150 + (Math.random() * 90 - 45)) + 'px';
  el.style.top = (110 + Math.random() * 60) + 'px';
  stage.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function popSparks(n = 9) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.background = COLORS[i % COLORS.length];
    s.style.left = (160 + Math.random() * 60) + 'px';
    s.style.top = (130 + Math.random() * 60) + 'px';
    stage.appendChild(s);
    const ang = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 90;
    s.animate(
      [{ transform: 'translate(0,0) scale(1)', opacity: 1 },
       { transform: `translate(${Math.cos(ang) * dist}px,${Math.sin(ang) * dist + 26}px) scale(.2)`, opacity: 0 }],
      { duration: 520 + Math.random() * 260, easing: 'cubic-bezier(.2,.7,.3,1)' }
    );
    setTimeout(() => s.remove(), 820);
  }
}

function shake() {
  dabai.classList.remove('hit');
  void dabai.offsetWidth;
  dabai.classList.add('hit');
  flash.classList.remove('on');
  void flash.offsetWidth;
  flash.classList.add('on');
  if (navigator.vibrate) navigator.vibrate(18);
}

/* ---------- 击打 ---------- */
function hit() {
  if (cleared) {
    say.textContent = '它已经不吭声了。火气清零，这一局结束。';
    return;
  }
  const d = DMG[mode];
  hp = Math.max(0, hp - d);

  if (mode === 'glove') combo++; else combo = 0;

  shake();
  popDamage(d);
  popSparks(mode === 'heavy' ? 16 : mode === 'rock' ? 12 : 8);
  thud(mode === 'heavy' ? 1.35 : mode === 'rock' ? 1.05 : 0.8);

  comboEl.textContent = combo >= 3 ? `连击 ×${combo} 🔥` : '';
  render();

  if (hp <= 0) {
    cleared = true;
    setTimeout(() => {
      say.textContent = '……行吧，你赢了。它不吭声了。';
    }, 300);
  } else {
    say.textContent = lineFor();
  }
}

function lineFor() {
  if (hp > 85) return '哼，就这？再来啊。';
  if (hp > 60) return '哎哟……你手不疼吗。';
  if (hp > 30) return '等、等一下，我脸有点疼……';
  if (hp > 0)  return '别打了别打了，我认输行不行……';
  return '……（它不吭声了）';
}

/* ---------- 交互 ---------- */
document.querySelectorAll('.act').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.act').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    mode = b.dataset.mode;
  };
});

stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.act')) return;
  hit();
});

$('#send').onclick = () => {
  const v = $('#inp').value.trim();
  if (!v) return;
  $('#inp').value = '';
  say.textContent = hp <= 0 ? '……（它已经不回话了）'
    : hp > 60 ? `「${v}」？你还挺有理。`
    : hp > 30 ? `「${v}」……别说了，疼。`
    : `「${v}」……求你别打了。`;
};

$('#inp').addEventListener('keydown', e => { if (e.key === 'Enter') $('#send').click(); });

$('#file').onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  $('#photo').innerHTML = `<img src="${url}" alt=""><div class="crack"></div>`;
};

$('#reset').onclick = () => {
  hp = MAXHP; combo = 0; cleared = false;
  comboEl.textContent = '';
  say.textContent = '又是新的一局。来吧。';
  render();
};

/* ?hp=45 可直接看某一档状态（方便截图） */
const q = new URLSearchParams(location.search);
if (q.get('hp')) { hp = Math.max(0, Math.min(100, +q.get('hp'))); cleared = hp <= 0; }
render();
if (hp <= 0) say.textContent = '……行吧，你赢了。它不吭声了。';
</script>
</body>
</html>
